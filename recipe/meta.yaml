{% set name = "pystackreg" %}
{% set version = "0.3.0" %}
{% set sha256 = "84b9abab9b65df339b0e435f6a15475ce122e3a9fd10516a913d05b79ef8facb" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - numpy
    - pip
    - setuptools >=77
  run:
    - python
    - numpy >=1.22
    - tqdm

test:
  imports:
    - pystackreg
    - pystackreg.turboreg
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/glichtner/pystackreg
  doc_url: https://pystackreg.readthedocs.io/
  dev_url: https://github.com/glichtner/pystackreg
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
  summary: Image registration (Python/C++ port of the ImageJ/Fiji plugins TurboReg and StackReg)
  description: |
    pystackreg aligns (registers) images and image stacks. It is a Python/C++
    port of the ImageJ plugins TurboReg and StackReg by Philippe Thevenaz
    (EPFL), based on

    P. Thevenaz, U.E. Ruttimann, M. Unser, "A Pyramid Approach to Subpixel
    Registration Based on Intensity", IEEE Transactions on Image Processing,
    vol. 7, no. 1, pp. 27-41, January 1998.

extra:
  recipe-maintainers:
    - glichtner
    - mrakitin
